name: METSE
options:
  bundleIdPrefix: com.bdrdesign
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "8"
    METSE_SOURCE_COMMIT: "UNSTAMPED"
targets:
  METSE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/METSE
      - path: Engine
      - path: Shaders
    resources:
      - path: Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bdrdesign.metse
        PRODUCT_NAME: METSE
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "8"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/METSE/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: iOS/METSE/METSE-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: ModelIO.framework
