name: METSE - Package Source Build 008
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-source.yml'
      - 'iOS/**'
      - 'Engine/**'
      - 'Shaders/**'
      - 'Content/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'Docs/**'
      - 'project.yml'
      - 'VERSION'
      - 'BUILD'
      - 'SOURCE_INTEGRITY_SHA256.txt'
permissions:
  contents: read
jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify exact source before packaging
        run: python3 Scripts/verify_integrity.py
      - name: Package exact tracked source
        run: |
          set -euo pipefail
          git archive --format=zip --output=METSE_Source_v0.3.0_build008.zip HEAD
          sha256sum METSE_Source_v0.3.0_build008.zip > METSE_Source_v0.3.0_build008.zip.sha256
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: METSE-source-v0.3.0-build008
          if-no-files-found: error
          retention-days: 14
          path: |
            METSE_Source_v0.3.0_build008.zip
            METSE_Source_v0.3.0_build008.zip.sha256
            SOURCE_COMMIT.txt
