name: METSE — Verified Source Gates

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m compileall -q Scripts
      - name: Verify manifest
        run: python3 Scripts/verify_manifest.py
      - name: Architecture guardrails
        run: python3 Scripts/guardrails.py
      - name: Static gates
        run: bash Scripts/static_checks.sh
