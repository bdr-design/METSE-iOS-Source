name: METSE iOS — Verified Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/verify_manifest.py
      - run: python3 Scripts/guardrails.py
      - run: bash Scripts/static_checks.sh

  ios-build:
    needs: source-gates
    runs-on: [self-hosted, macOS, metse-unreal-5-8]
    steps:
      - uses: actions/checkout@v4
      - name: macOS / Xcode / Unreal preflight
        run: bash Scripts/ci_preflight_macos.sh
      - name: Unreal automation tests
        run: bash Scripts/run_unreal_tests_macos.sh
      - name: Build unsigned IPA
        run: bash Scripts/build_ios_unsigned_macos.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: METSE-v0.1.0-build001-unsigned-IPA
          path: Dist/*.ipa
          if-no-files-found: error
