name: METSE iOS — Verified Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verified source gates
        run: bash Scripts/static_checks.sh

  ios-build:
    needs: verified-source
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Prepare verified Unreal Installed Build
        env:
          ENGINE_ARCHIVE_URL: ${{ secrets.ENGINE_ARCHIVE_URL }}
          ENGINE_ARCHIVE_SHA256: ${{ secrets.ENGINE_ARCHIVE_SHA256 }}
        run: bash Scripts/prepare_unreal_installed_build_macos.sh

      - name: Preflight macOS, Xcode, Unreal and source integrity
        run: bash Scripts/ci_preflight_macos.sh

      - name: Unreal automation tests
        run: bash Scripts/run_unreal_tests_macos.sh

      - name: Build, cook, stage and create unsigned IPA
        run: bash Scripts/build_ios_unsigned_macos.sh

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: METSE-v0.1.0-build001-unsigned-IPA
          if-no-files-found: error
          path: |
            Artifacts/METSE_v0.1.0_build001_unsigned.ipa
            Artifacts/METSE_v0.1.0_build001_unsigned.ipa.sha256
            TestResults/**
            BuildLogs/**
