name: METSE iOS - Build 008 Mega Combat Verified IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - 'Engine/**'
      - 'Shaders/**'
      - 'Content/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'Docs/**'
      - 'project.yml'
      - 'VERSION'
      - 'BUILD'
      - 'SOURCE_INTEGRITY_SHA256.txt'
      - '.github/workflows/build-ios-unsigned.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'iOS/**'
      - 'Engine/**'
      - 'Shaders/**'
      - 'Content/**'
      - 'Scripts/**'
      - 'Tests/**'
      - 'Docs/**'
      - 'project.yml'
      - 'VERSION'
      - 'BUILD'
      - 'SOURCE_INTEGRITY_SHA256.txt'
      - '.github/workflows/build-ios-unsigned.yml'
permissions:
  contents: read
concurrency:
  group: metse-native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Source integrity
        run: python3 Scripts/verify_integrity.py
      - name: Architecture guardrails
        run: python3 Scripts/guardrails.py
      - name: Build 009-E action/cover guardrails
        run: python3 Scripts/guardrails_009e.py
      - name: Build 009-F battlefield guardrails
        run: python3 Scripts/guardrails_009f.py
      - name: Build 009-G audio/FX/visibility guardrails
        run: python3 Scripts/guardrails_009g.py
      - name: Build 009-H Observatory/Black Box guardrails
        run: python3 Scripts/guardrails_009h.py
      - name: Build 010-A Combatant Authority guardrails
        run: python3 Scripts/guardrails_010a.py
      - name: Build 010-B Combatant Lifecycle guardrails
        run: python3 Scripts/guardrails_010b.py
      - name: Build 010-C Tactical Suppression guardrails
        run: python3 Scripts/guardrails_010c.py
      - name: Build 010-D Injury/Local Team Reaction guardrails
        run: python3 Scripts/guardrails_010d.py
      - name: Build 010-E telemetry capture guardrails
        run: python3 Scripts/guardrails_010e.py
      - name: Build 010-F persistence guardrails
        run: python3 Scripts/guardrails_010f.py
      - name: Build 010-G combat pressure guardrails
        run: python3 Scripts/guardrails_010g.py
      - name: Build 011-A native visual guardrails
        run: python3 Scripts/guardrails_011a.py
      - name: C++ mega combat foundation tests
        run: bash Scripts/test_engine_core.sh
      - name: Two simulated hours deterministic host soak
        run: bash Scripts/test_engine_soak.sh 7200
      - name: Two simulated hours repeated combat pressure
        run: bash Scripts/test_engine_soak.sh 7200 combat
      - name: Swift diagnostic archive regression tests
        run: bash Scripts/test_diagnostic_archive.sh
      - name: Swift syntax fast gate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            xcrun swiftc -frontend -parse "$file"
          done < <(find iOS -name '*.swift' -type f | sort)
      - name: Metal compile fast gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-output/preflight
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos metal \
            -c \
            -target air64-apple-ios17.0 \
            -isysroot "$SDK_PATH" \
            -o .ci-output/preflight/METSERenderer.air \
            Shaders/METSERenderer.metal
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode platform compile gate
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          set -o pipefail
          xcodebuild \
            -project METSE.xcodeproj \
            -scheme METSE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath .ci-output/PreflightDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee .ci-output/preflight-xcodebuild.log
      - name: Build native unsigned IPA
        run: bash Scripts/build_unsigned_ipa.sh
      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: METSE-v0.3.0-build008-mega-combat-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            .ci-output/METSE_v0.3.0_build008_unsigned.ipa
            .ci-output/METSE_v0.3.0_build008_unsigned.ipa.sha256
            .ci-output/xcodebuild.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: METSE-build008-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .ci-output/preflight-xcodebuild.log
            .ci-output/xcodebuild.log
